<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无尽卷轴 · Infinite Scroll of Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background: linear-gradient(to bottom, #f5f0e8, #ebe4d8);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        .scroll-container {
            width: 100%;
            height: 100vh;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .scroll-content {
            display: flex;
            height: 100vh;
            align-items: center;
            gap: 0;
            min-width: max-content;
        }

        /* 左右填充用于居中 */
        .scroll-content::before,
        .scroll-content::after {
            content: '';
            display: block;
            min-width: 50vw;
            height: 100vh;
            flex-shrink: 0;
        }

        .scroll-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-width: 200px;
            height: 100vh;
            padding: 0 60px;
            flex-shrink: 0;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .scroll-item-content {
            font-size: 32px;
            line-height: 2;
            letter-spacing: 0.2em;
            color: #2c2c2c;
            position: relative;
            padding: 20px;
            writing-mode: vertical-rl;
            text-orientation: upright;
        }

        .scroll-item-content::before,
        .scroll-item-content::after {
            content: '';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 1px;
            background: linear-gradient(to right, transparent, #c9b896, transparent);
        }

        .scroll-item-content::before {
            right: -25px;
        }

        .scroll-item-content::after {
            left: -25px;
        }

        /* 水印 */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 140px;
            color: rgba(201, 184, 150, 0.06);
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.3em;
            pointer-events: none;
            z-index: 1;
            font-weight: 200;
        }

        /* 变体样式 */
        .scroll-item.variant-1 .scroll-item-content {
            color: #3a3a3a;
            font-size: 28px;
        }

        .scroll-item.variant-2 .scroll-item-content {
            color: #252525;
            font-size: 36px;
            letter-spacing: 0.25em;
        }

        .scroll-item.variant-3 .scroll-item-content {
            color: #2c2c2c;
            opacity: 0.92;
        }

        /* 呼吸空间 */
        .spacer {
            min-width: 150px;
            height: 100vh;
            flex-shrink: 0;
            position: relative;
        }

        .spacer::after {
            content: '◦';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(201, 184, 150, 0.25);
            font-size: 14px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .scroll-item-content {
                font-size: 24px;
                padding: 15px;
            }

            .scroll-item.variant-1 .scroll-item-content {
                font-size: 22px;
            }

            .scroll-item.variant-2 .scroll-item-content {
                font-size: 26px;
            }

            .watermark {
                font-size: 100px;
            }

            .scroll-item {
                min-width: 150px;
                padding: 0 40px;
            }

            .spacer {
                min-width: 100px;
            }
        }

        /* 纹理效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 2px,
                rgba(201, 184, 150, 0.02) 2px,
                rgba(201, 184, 150, 0.02) 4px
            );
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="scroll-container">
        <div class="scroll-content" id="scrollContent">
            <!-- 内容将通过 JavaScript 动态生成 -->
        </div>
    </div>

    <div class="watermark">此刻</div>

    <script>
        // 无尽卷轴 - 永远的"此刻"
        class InfiniteScrollOfNow {
            constructor() {
                this.container = document.querySelector('.scroll-container');
                this.content = document.getElementById('scrollContent');
                this.contentPool = this.getContentPool();
                this.currentIndex = 0;
                this.isScrolling = false;
                this.scrollThreshold = 300;

                this.init();
            }

            getContentPool() {
                return [
                    '春去秋來',
                    '雲無心以出岫',
                    '鳥倦飛而知還',
                    '花開花落',
                    '水流雲在',
                    '行到水窮處',
                    '坐看雲起時',
                    '明月松間照',
                    '清泉石上流',
                    '空山新雨後',
                    '天氣晚來秋',
                    '采菊東籬下',
                    '悠然見南山',
                    '山氣日夕佳',
                    '飛鳥相與還',
                    '此中有真意',
                    '欲辨已忘言',
                    '萬物靜觀皆自得',
                    '四時佳興與人同',
                    '隨處遇之',
                    '不滯於物',
                    '去留無意',
                    '寵辱不驚',
                    '閑看庭前花開花落',
                    '漫隨天外雲卷雲舒',
                    '一花一世界',
                    '一葉一菩提',
                    '念念不住',
                    '前念今念後念',
                    '念念不相待',
                    '剎那即永恆',
                    '當下即是',
                ];
            }

            init() {
                console.log('无尽卷轴初始化...');
                this.createInitialContent();

                setTimeout(() => {
                    this.centerScroll();
                    console.log('初始化完成！内容项数量:', document.querySelectorAll('.scroll-item').length);
                }, 100);

                this.container.addEventListener('scroll', () => this.handleScroll());
                this.container.style.scrollBehavior = 'auto';
            }

            createInitialContent() {
                const itemCount = 15;
                for (let i = 0; i < itemCount; i++) {
                    this.addItem('append');
                }
            }

            addItem(position = 'append') {
                const item = this.createScrollItem();
                const spacer = this.createSpacer();

                if (position === 'prepend') {
                    this.content.insertBefore(spacer, this.content.firstChild);
                    this.content.insertBefore(item, this.content.firstChild);
                } else {
                    this.content.appendChild(item);
                    this.content.appendChild(spacer);
                }
            }

            createScrollItem() {
                const item = document.createElement('div');
                item.className = 'scroll-item';

                const text = this.contentPool[this.currentIndex % this.contentPool.length];
                this.currentIndex++;

                const variant = Math.floor(Math.random() * 3) + 1;
                item.classList.add(`variant-${variant}`);

                const content = document.createElement('div');
                content.className = 'scroll-item-content';
                content.textContent = text;

                item.appendChild(content);
                return item;
            }

            createSpacer() {
                const spacer = document.createElement('div');
                spacer.className = 'spacer';
                return spacer;
            }

            handleScroll() {
                if (this.isScrolling) return;

                this.isScrolling = true;

                requestAnimationFrame(() => {
                    const scrollLeft = this.container.scrollLeft;
                    const scrollWidth = this.container.scrollWidth;
                    const clientWidth = this.container.clientWidth;
                    const center = (scrollWidth - clientWidth) / 2;

                    if (Math.abs(scrollLeft - center) > this.scrollThreshold) {
                        this.rebalance(scrollLeft, center);
                    }

                    this.isScrolling = false;
                });
            }

            rebalance(currentScroll, center) {
                const isScrollingRight = currentScroll > center;

                if (isScrollingRight) {
                    this.addItem('append');
                    this.removeOldItems('start', 2);
                } else {
                    this.addItem('prepend');
                    this.removeOldItems('end', 2);
                }

                setTimeout(() => {
                    this.centerScroll();
                }, 10);
            }

            removeOldItems(position, count) {
                for (let i = 0; i < count; i++) {
                    if (position === 'start') {
                        if (this.content.firstChild) {
                            this.content.removeChild(this.content.firstChild);
                        }
                    } else {
                        if (this.content.lastChild) {
                            this.content.removeChild(this.content.lastChild);
                        }
                    }
                }
            }

            centerScroll() {
                const scrollWidth = this.container.scrollWidth;
                const clientWidth = this.container.clientWidth;
                const center = (scrollWidth - clientWidth) / 2;

                this.container.scrollLeft = center;
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            new InfiniteScrollOfNow();
        });
    </script>
</body>
</html>
