<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无尽卷轴 · Infinite Scroll of Now</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@200;300;400;500;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif TC', 'Ma Shan Zheng', serif;
            background: radial-gradient(ellipse at center, #1a1510 0%, #0a0a0a 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 3D 舞台 */
        .stage {
            width: 100%;
            height: 100vh;
            position: relative;
            perspective: 1800px;
            perspective-origin: 50% 50%;
            overflow: hidden;
        }

        .scroll-track {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            left: 0;
            top: 0;
        }

        .scroll-item {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
        }

        .scroll-item-content {
            writing-mode: vertical-rl;
            text-orientation: upright;
            white-space: nowrap;
            padding: 50px 40px;
            position: relative;
            font-weight: 400;
            color: #d4c5a9;
            font-size: 40px;
            letter-spacing: 0.3em;
        }

        /* 装饰线条 */
        .scroll-item-content::before,
        .scroll-item-content::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 0px;
            height: 2px;
            background: linear-gradient(to right,
                transparent,
                rgba(245, 230, 211, 0.8),
                transparent);
            transform: translateY(-50%);
            transition: all 0.6s ease;
        }

        .scroll-item-content::before {
            right: -20px;
        }

        .scroll-item-content::after {
            left: -20px;
        }

        /* 水印 - 更明显 */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 280px;
            color: rgba(201, 184, 150, 0.08);
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.6em;
            pointer-events: none;
            z-index: 1;
            font-weight: 200;
            animation: breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.08;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 0.15;
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* 环境光效 */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle,
                rgba(245, 230, 211, 0.12) 0%,
                transparent 70%);
            pointer-events: none;
            z-index: 2;
            animation: pulse-glow 8s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.15);
                opacity: 1;
            }
        }

        /* 渐变遮罩 */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                transparent 0%,
                transparent 35%,
                rgba(10, 10, 10, 0.5) 75%,
                rgba(10, 10, 10, 0.9) 100%);
            pointer-events: none;
            z-index: 50;
        }

        /* 中心标记线 */
        .center-marker {
            position: fixed;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100vh;
            background: linear-gradient(to bottom,
                transparent 0%,
                rgba(245, 230, 211, 0.15) 30%,
                rgba(245, 230, 211, 0.4) 50%,
                rgba(245, 230, 211, 0.15) 70%,
                transparent 100%);
            z-index: 60;
        }

        /* 粒子装饰 */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(201, 184, 150, 0.7);
            border-radius: 50%;
            pointer-events: none;
            animation: float-particle linear infinite;
            box-shadow: 0 0 8px rgba(201, 184, 150, 0.5);
        }

        @keyframes float-particle {
            0% {
                transform: translateY(110vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(100vh) translateX(0) scale(1);
            }
            90% {
                opacity: 1;
                transform: translateY(10vh) translateX(40px) scale(1);
            }
            100% {
                transform: translateY(-10vh) translateX(60px) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="vignette"></div>
    <div class="center-marker"></div>

    <div class="stage">
        <div class="scroll-track" id="track">
            <!-- 内容动态生成 -->
        </div>
    </div>

    <div class="watermark">此刻</div>

    <script>
        const poems = [
            '春去秋來', '雲無心以出岫', '鳥倦飛而知還',
            '花開花落', '水流雲在', '行到水窮處',
            '坐看雲起時', '明月松間照', '清泉石上流',
            '空山新雨後', '天氣晚來秋', '采菊東籬下',
            '悠然見南山', '山氣日夕佳', '飛鳥相與還',
            '此中有真意', '欲辨已忘言', '萬物靜觀皆自得',
            '四時佳興與人同', '隨處遇之', '不滯於物',
            '去留無意', '寵辱不驚', '閑看庭前花開花落',
            '漫隨天外雲卷雲舒', '一花一世界', '一葉一菩提',
            '念念不住', '前念今念後念', '念念不相待',
            '剎那即永恆', '當下即是'
        ];

        const track = document.getElementById('track');
        const items = [];
        let currentIndex = 0;
        let offset = 0;
        const itemSpacing = 550;

        // 创建粒子
        function createParticles() {
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (12 + Math.random() * 18) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(particle);
            }
        }

        // 创建滚动项
        function createItem(text) {
            const item = document.createElement('div');
            item.className = 'scroll-item';

            const content = document.createElement('div');
            content.className = 'scroll-item-content';
            content.textContent = text;

            item.appendChild(content);
            track.appendChild(item);

            return item;
        }

        // 初始化 - 创建足够多的项目
        function init() {
            for (let i = 0; i < 15; i++) {
                const item = createItem(poems[currentIndex % poems.length]);
                items.push(item);
                currentIndex++;
            }
        }

        // 基于距离的连续 3D 变换
        function updateItem3D(item, distanceFromCenter) {
            const absDistance = Math.abs(distanceFromCenter);

            // 计算缩放 - 中心最大 (1.3)，越远越小 (0.3)
            let scale = 1.3 - (absDistance / 1000);
            scale = Math.max(0.3, Math.min(1.3, scale));

            // 计算模糊 - 中心无模糊，越远越模糊 (最大 20px)
            let blur = (absDistance / 80);
            blur = Math.min(20, blur);

            // 计算透明度 - 中心完全不透明，越远越透明
            let opacity = 1 - (absDistance / 1200);
            opacity = Math.max(0.1, Math.min(1, opacity));

            // 计算 Z 深度 - 中心向前，两边向后
            let translateZ = 300 - (absDistance / 2);
            translateZ = Math.max(-500, Math.min(300, translateZ));

            // 计算旋转 - 两边有轻微旋转
            let rotateY = (distanceFromCenter / 800) * 15;
            rotateY = Math.max(-15, Math.min(15, rotateY));

            // 计算颜色 - 中心更亮
            const centerBrightness = 1 - (absDistance / 1000);
            let color;
            if (centerBrightness > 0.8) {
                color = '#f5e6d3'; // 最亮
            } else if (centerBrightness > 0.6) {
                color = '#d4c5a9';
            } else if (centerBrightness > 0.4) {
                color = '#b8a589';
            } else {
                color = '#8b7355';
            }

            // 应用变换
            item.style.transform = `translateX(${distanceFromCenter}px) translate(-50%, -50%) translateZ(${translateZ}px) scale(${scale}) rotateY(${rotateY}deg)`;
            item.style.opacity = opacity;
            item.style.filter = `blur(${blur}px)`;
            item.querySelector('.scroll-item-content').style.color = color;

            // 文字大小也随缩放变化
            const fontSize = 30 + (scale * 30);
            item.querySelector('.scroll-item-content').style.fontSize = fontSize + 'px';

            // 发光效果 - 只在中心
            if (absDistance < 100) {
                const glowIntensity = 1 - (absDistance / 100);
                item.querySelector('.scroll-item-content').style.textShadow =
                    `0 0 ${30 * glowIntensity}px rgba(245, 230, 211, ${glowIntensity}),
                     0 0 ${60 * glowIntensity}px rgba(245, 230, 211, ${glowIntensity * 0.6}),
                     0 0 ${90 * glowIntensity}px rgba(245, 230, 211, ${glowIntensity * 0.3})`;

                // 显示装饰线
                const lineWidth = 60 * glowIntensity;
                const content = item.querySelector('.scroll-item-content');
                content.style.setProperty('--line-width', lineWidth + 'px');
                if (content.style.getPropertyValue('--line-width')) {
                    content.style.setProperty('--line-width', lineWidth + 'px');
                }

                // 通过伪元素宽度
                if (glowIntensity > 0.5) {
                    content.querySelector('::before')?.style.setProperty('width', lineWidth + 'px');
                    content.querySelector('::after')?.style.setProperty('width', lineWidth + 'px');
                }
            } else {
                item.querySelector('.scroll-item-content').style.textShadow = 'none';
            }
        }

        // 平滑滚动动画
        function animate() {
            offset += 1; // 滚动速度

            // 更新所有项目
            const centerIndex = Math.floor(items.length / 2);
            items.forEach((item, index) => {
                const relativePos = index - centerIndex;
                const baseX = relativePos * itemSpacing - offset;

                updateItem3D(item, baseX);
            });

            // 循环逻辑
            if (offset >= itemSpacing) {
                offset = 0;

                // 移除第一个项目
                const removed = items.shift();
                track.removeChild(removed);

                // 在末尾添加新项目
                const newItem = createItem(poems[currentIndex % poems.length]);
                items.push(newItem);
                currentIndex++;
            }

            requestAnimationFrame(animate);
        }

        // 启动
        createParticles();
        init();
        requestAnimationFrame(animate);

        console.log('✨ 无尽卷轴 3D - 平滑流动中...');
    </script>
</body>
</html>
