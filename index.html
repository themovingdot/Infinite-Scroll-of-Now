<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无尽卷轴 · Infinite Scroll of Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'STSong', 'SimSun', serif;
            background: radial-gradient(ellipse at center, #1a1510 0%, #0a0a0a 100%);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* 3D 容器 */
        .scroll-container {
            width: 100%;
            height: 100vh;
            position: relative;
            perspective: 1500px;
            perspective-origin: 50% 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scroll-content {
            display: flex;
            align-items: center;
            transform-style: preserve-3d;
            position: relative;
        }

        .scroll-item {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 300px;
            height: 100vh;
            position: relative;
            transform-style: preserve-3d;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .scroll-item-content {
            font-size: 36px;
            line-height: 2;
            letter-spacing: 0.3em;
            color: #d4c5a9;
            padding: 30px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            text-shadow: 0 0 30px rgba(212, 197, 169, 0.5);
            transition: all 0.8s ease;
        }

        /* 3D 位置效果 */
        .scroll-item {
            opacity: 0.3;
            filter: blur(8px);
            transform: translateZ(-300px) scale(0.75);
        }

        .scroll-item:nth-child(5n+2) {
            opacity: 0.5;
            filter: blur(5px);
            transform: translateZ(-150px) scale(0.85) rotateY(10deg);
        }

        .scroll-item:nth-child(5n+3) {
            opacity: 1;
            filter: blur(0px);
            transform: translateZ(150px) scale(1.15);
            z-index: 10;
        }

        .scroll-item:nth-child(5n+3) .scroll-item-content {
            color: #f5e6d3;
            font-size: 52px;
            text-shadow: 0 0 50px rgba(245, 230, 211, 1),
                         0 0 100px rgba(245, 230, 211, 0.5);
        }

        .scroll-item:nth-child(5n+4) {
            opacity: 0.5;
            filter: blur(5px);
            transform: translateZ(-150px) scale(0.85) rotateY(-10deg);
        }

        /* 水印 */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            color: rgba(201, 184, 150, 0.04);
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 0.5em;
            pointer-events: none;
            z-index: 1;
            font-weight: 100;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.04;
            }
            50% {
                opacity: 0.08;
            }
        }

        /* 渐变遮罩 */
        .fade-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right,
                #0a0a0a 0%,
                transparent 25%,
                transparent 75%,
                #0a0a0a 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* 中心线 */
        .center-line {
            position: fixed;
            top: 0;
            left: 50%;
            width: 1px;
            height: 100vh;
            background: linear-gradient(to bottom,
                transparent,
                rgba(201, 184, 150, 0.2) 50%,
                transparent);
            z-index: 6;
        }

        /* 动画 */
        @keyframes slide {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-450px);
            }
        }

        .scroll-content {
            animation: slide 8s linear infinite;
        }

        .spacer {
            min-width: 150px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="fade-overlay"></div>
    <div class="center-line"></div>

    <div class="scroll-container">
        <div class="scroll-content" id="content">
            <!-- 初始内容 -->
            <div class="scroll-item"><div class="scroll-item-content">春去秋來</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">雲無心以出岫</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">花開花落</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">水流雲在</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">行到水窮處</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">坐看雲起時</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">明月松間照</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">清泉石上流</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">去留無意</div></div>
            <div class="spacer"></div>
            <div class="scroll-item"><div class="scroll-item-content">寵辱不驚</div></div>
            <div class="spacer"></div>
        </div>
    </div>

    <div class="watermark">此刻</div>

    <script>
        console.log('Infinite Scroll loading...');

        const content = document.getElementById('content');
        const poems = [
            '春去秋來', '雲無心以出岫', '鳥倦飛而知還',
            '花開花落', '水流雲在', '行到水窮處',
            '坐看雲起時', '明月松間照', '清泉石上流',
            '空山新雨後', '采菊東籬下', '悠然見南山',
            '此中有真意', '去留無意', '寵辱不驚',
            '一花一世界', '一葉一菩提', '當下即是'
        ];

        let index = 0;
        let offset = 0;

        function addItem() {
            const item = document.createElement('div');
            item.className = 'scroll-item';
            const text = document.createElement('div');
            text.className = 'scroll-item-content';
            text.textContent = poems[index % poems.length];
            item.appendChild(text);

            const spacer = document.createElement('div');
            spacer.className = 'spacer';

            content.appendChild(item);
            content.appendChild(spacer);
            index++;
        }

        function animate() {
            offset += 0.5;

            if (offset >= 450) {
                offset = 0;
                // Remove first two elements
                if (content.children.length > 4) {
                    content.removeChild(content.firstChild);
                    content.removeChild(content.firstChild);
                }
                addItem();
            }

            content.style.transform = `translateX(-${offset}px)`;
            requestAnimationFrame(animate);
        }

        // Start
        console.log('Starting animation...');
        requestAnimationFrame(animate);
    </script>
</body>
</html>
